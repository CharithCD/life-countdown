<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Countdown</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon_io/favicon-16x16.png"
    />
    <link rel="manifest" href="favicon_io/site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Settings Icon -->
    <div class="settings" id="settingsIcon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
        />
      </svg>
    </div>

    <!-- Centered Content Container -->
    <div class="centered-content">
      <div class="message" id="motivationMessage">
        Stop wasting time, it's ticking out of your hand
      </div>

      <div id="countdownTitle" class="countdown-title"></div>
      <div id="countdown" class="countdown">
        <div class="time-unit">
          <span id="years">00</span>
          <p>YEARS</p>
        </div>
        <div class="time-unit">
          <span id="months">00</span>
          <p>MONTHS</p>
        </div>
        <div class="time-unit">
          <span id="days">00</span>
          <p>DAYS</p>
        </div>
        <div class="time-unit">
          <span id="hours">00</span>
          <p>HOURS</p>
        </div>
        <div class="time-unit">
          <span id="minutes">00</span>
          <p>MINUTES</p>
        </div>
        <div class="time-unit">
          <span id="seconds">00</span>
          <p>SECONDS</p>
        </div>
      </div>
    </div>

    <!-- GitHub-style Grid Covering Full Page -->
    <div class="grid" id="gridContainer"></div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
      <div class="modal-content">
        <h2>Set Countdown</h2>
        <p>Select either your lifespan or a specific event deadline.</p>

        <!-- Tabbed Interface for Options -->
        <div class="tab">
          <button id="tabLifespan" class="tablinks">Lifespan Countdown</button>
          <button id="tabEvent" class="tablinks">Event Deadline</button>
        </div>

        <!-- Lifespan Input -->
        <div id="Lifespan" class="tabcontent">
          <label for="dobInput">Enter your Date of Birth:</label>
          <input type="date" id="dobInput" required />
        </div>

        <!-- Event Deadline Inputs -->
        <div id="Event" class="tabcontent">
          <label for="eventTitle">Event Title:</label>
          <input type="text" id="eventTitle" placeholder="Enter event title" />

          <label for="startDate">Start Date:</label>
          <input type="date" id="startDate" />

          <label for="endDate">End Date:</label>
          <input type="date" id="endDate" />
        </div>

        <p id="errorMessage" style="color: red; display: none">
          Please fill in all fields.
        </p>
        <button id="saveSettings">Start Countdown</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
